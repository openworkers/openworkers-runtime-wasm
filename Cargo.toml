[package]
name = "openworkers-runtime-wasm"
version = "0.15.3"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly runtime for OpenWorkers using Wasmtime"
license = "Apache-2.0"

[dependencies]
# Core types (with wasm feature for WorkerCode::WebAssembly)
# openworkers-core = { path = "../openworkers-core", features = ["wasm"] }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.15.0", features = ["wasm"] }

# Wasmtime runtime with component model, WASI, and wasi:http support;
# component-model-async carries the WASI 0.3 async canonical ABI
wasmtime = { version = "48", features = ["component-model", "component-model-async"] }
wasmtime-wasi = "48"
# default-send-request would pull in a TLS client stack; outbound requests go
# through the runner's ops handler instead
wasmtime-wasi-http = { version = "48", default-features = false, features = ["p2", "p3"] }

# HTTP types shared with wasmtime-wasi-http
hyper = "1"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Bytes handling
bytes = "1"

# Rows and KV values cross the binding boundary as JSON
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
