[package]
name = "openworkers-runtime-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly runtime for OpenWorkers using Wasmtime"
license = "Apache-2.0"

[dependencies]
# Core types
openworkers-core = { path = "../openworkers-core" }

# Wasmtime runtime with component model and WASI support
wasmtime = { version = "29", features = ["component-model"] }
wasmtime-wasi = "29"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Bytes handling
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
