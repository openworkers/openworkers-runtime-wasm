[package]
name = "openworkers-runtime-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly runtime for OpenWorkers using Wasmtime"
license = "Apache-2.0"

[dependencies]
# Core types
openworkers-core = { path = "../openworkers-core" }

# Wasmtime runtime
wasmtime = "29"
# wasmtime-wasi = "29"  # TODO: Add WASI support later

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Serialization (for host<->guest communication)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bytes handling
bytes = "1"

# Base64 for WASM encoding
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
